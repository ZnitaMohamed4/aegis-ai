<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" (click)="toggleSidebar.emit()">
      <i class="pi pi-bars"></i>
    </button>
    <span class="company-badge">Smart Automations Technologies</span>
  </div>

  <div class="topbar-right">
    <!-- Language Switcher -->
    <div class="lang-switcher">
      <button class="lang-btn" (click)="toggleLangMenu()">
        <span class="lang-flag">{{ currentLang().flag }}</span>
        <span class="lang-code">{{ currentLang().code }}</span>
        <i class="pi pi-chevron-down ml-1 text-[10px]"></i>
      </button>
      
      @if (showLangMenu()) {
        <div class="lang-menu">
          @for (lang of languages; track lang.code) {
            <button class="lang-item" [class.active]="lang.code === currentLang().code" (click)="selectLanguage(lang)">
              <span class="lang-flag">{{ lang.flag }}</span>
              <span class="lang-label">{{ lang.label }}</span>
            </button>
          }
        </div>
      }
    </div>

    <!-- Alert bell -->
    <button class="icon-btn badge-btn">
      <i class="pi pi-bell"></i>
      <span class="badge badge-critical">3</span>
    </button>

    <!-- Theme toggle -->
    <button class="icon-btn" (click)="toggleTheme()" title="Toggle theme">
      <i class="pi" [class.pi-moon]="!darkMode()" [class.pi-sun]="darkMode()"></i>
    </button>

    <!-- User avatar / Logout Action -->
    <div class="user-pill flex items-center gap-3 cursor-pointer" (click)="logout()" title="Log out">
      <div class="avatar" [style.background]="isParentView() ? '#25d366' : 'var(--accent)'">
        {{ isParentView() ? 'P' : 'A' }}
      </div>
      <div class="user-info">
        <span class="user-name">{{ isParentView() ? 'Parent User' : 'Admin' }}</span>
        <span class="user-role flex items-center gap-1"><i class="pi pi-sign-out text-[10px]"></i> Sign out</span>
      </div>
    </div>

  </div>
</header>
