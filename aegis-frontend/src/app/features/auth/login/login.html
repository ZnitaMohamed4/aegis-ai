<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-mark">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="login-title">AegisAI</h1>
      <p class="login-subtitle">Sign in to your account</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <i class="pi pi-user input-icon"></i>
          <input type="text" id="username" [(ngModel)]="username" name="username" class="form-control" placeholder="Enter your username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="pi pi-lock input-icon"></i>
          <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <i class="pi pi-exclamation-circle"></i> {{ errorMessage }}
      </div>

      <button type="submit" class="primary-btn" [disabled]="isLoading || !username || !password">
        <i class="pi pi-spin pi-spinner" *ngIf="isLoading" style="margin-right: 0.5rem"></i>
        {{ isLoading ? 'Authenticating...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
