<div class="p-4 sm:p-6 w-full">

  <!-- Header -->
  <div class="flex items-start justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-[var(--text-primary)] mb-1">Live Alerts</h1>
      <p class="text-sm text-[var(--text-muted)]">All detected harassment events — real-time</p>
    </div>
    <div class="flex items-center gap-2 text-xs font-semibold text-[var(--low)] bg-green-500/10 border border-green-500/20 px-3 py-1.5 rounded-full">
      <span class="w-2 h-2 rounded-full bg-[var(--low)] animate-pulse"></span>
      Live
    </div>
  </div>

  <app-alerts-table
    [alerts]="alerts()"
    (resolve)="onResolve($event)">
  </app-alerts-table>

</div>
